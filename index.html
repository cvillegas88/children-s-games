<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aventura de Cubitos</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --azul: #5ec8ff;
      --azul-oscuro: #2364aa;
      --verde: #62d45f;
      --verde-oscuro: #2f9e44;
      --amarillo: #ffd95a;
      --naranja: #ff9f43;
      --rojo: #ff6b6b;
      --morado: #8e7dff;
      --rosa: #ff8bd1;
      --texto: #26364d;
      --panel: rgba(255, 255, 255, 0.88);
      --sombra: 0 12px 28px rgba(24, 55, 90, 0.22);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texto);
      overflow: hidden;
      background: linear-gradient(#62cfff 0%, #b7f5ff 47%, #96ea65 47%, #64cb52 100%);
      user-select: none;
      touch-action: manipulation;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 14px;
      padding: 14px;
    }

    .game-area {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      background: linear-gradient(#7edcff 0%, #c8f8ff 48%, #8ee875 48%, #61c94f 100%);
      box-shadow: var(--sombra);
      border: 6px solid rgba(255, 255, 255, 0.7);
    }

    .top-bar {
      position: absolute;
      z-index: 20;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .title-card,
    .score-card {
      pointer-events: auto;
      background: var(--panel);
      border: 4px solid white;
      box-shadow: 0 8px 18px rgba(35, 74, 110, 0.18);
      border-radius: 22px;
      padding: 10px 16px;
      backdrop-filter: blur(5px);
    }

    .title-card h1 {
      margin: 0;
      font-size: clamp(20px, 2.7vw, 34px);
      letter-spacing: 0.4px;
    }

    .title-card p {
      margin: 3px 0 0;
      font-size: clamp(13px, 1.3vw, 17px);
      font-weight: 700;
      color: #48627e;
    }

    .score-card {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 900;
    }

    .world {
      position: absolute;
      inset: 0;
    }

    .sun {
      position: absolute;
      width: 90px;
      height: 90px;
      top: 92px;
      right: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff6a2 0%, #ffd54d 60%, #ffb703 100%);
      box-shadow: 0 0 35px rgba(255, 213, 77, 0.7);
      cursor: pointer;
      animation: float 4s ease-in-out infinite;
    }

    .cloud {
      position: absolute;
      width: 130px;
      height: 48px;
      background: white;
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(87, 147, 180, 0.2);
      cursor: pointer;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .cloud::before {
      width: 62px;
      height: 62px;
      left: 18px;
      top: -28px;
    }

    .cloud::after {
      width: 76px;
      height: 76px;
      right: 16px;
      top: -40px;
    }

    .cloud.one { top: 120px; left: 120px; animation: drift 12s ease-in-out infinite; }
    .cloud.two { top: 210px; left: 44%; transform: scale(0.8); animation: drift 16s ease-in-out infinite reverse; }

    .house {
      position: absolute;
      left: 7%;
      bottom: 15%;
      width: min(260px, 28vw);
      height: min(210px, 30vh);
      cursor: pointer;
    }

    .house-roof {
      position: absolute;
      left: 5%;
      top: 0;
      width: 90%;
      height: 45%;
      background: #ff6b6b;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      filter: drop-shadow(0 8px 5px rgba(0,0,0,0.12));
    }

    .house-body {
      position: absolute;
      left: 12%;
      bottom: 0;
      width: 76%;
      height: 68%;
      background: #ffe08a;
      border: 6px solid #fff3bf;
      border-radius: 18px;
      box-shadow: 0 10px 16px rgba(84, 76, 44, 0.2);
    }

    .door {
      position: absolute;
      left: 39%;
      bottom: 0;
      width: 24%;
      height: 52%;
      background: #b5651d;
      border-radius: 18px 18px 4px 4px;
      transform-origin: left center;
      transition: transform 0.35s ease;
    }

    .door.open {
      transform: perspective(400px) rotateY(-46deg);
      background: #8d4b17;
    }

    .window {
      position: absolute;
      top: 28%;
      width: 22%;
      height: 22%;
      background: #8be9ff;
      border: 5px solid white;
      border-radius: 12px;
    }

    .window.left { left: 12%; }
    .window.right { right: 12%; }

    .tree {
      position: absolute;
      bottom: 14%;
      right: 7%;
      width: min(160px, 15vw);
      height: min(230px, 34vh);
      cursor: pointer;
    }

    .tree-trunk {
      position: absolute;
      bottom: 0;
      left: 42%;
      width: 20%;
      height: 45%;
      background: #9c5b2e;
      border-radius: 18px;
    }

    .tree-top {
      position: absolute;
      bottom: 32%;
      left: 4%;
      width: 92%;
      height: 66%;
      background: #2fbd54;
      border-radius: 50%;
      box-shadow: inset -15px -12px 0 rgba(0,0,0,0.08);
    }

    .apple {
      position: absolute;
      width: 24px;
      height: 24px;
      background: #ff4757;
      border-radius: 50%;
      box-shadow: inset -4px -3px 0 rgba(0,0,0,0.12);
    }

    .apple.a1 { left: 32%; top: 22%; }
    .apple.a2 { right: 26%; top: 34%; }
    .apple.a3 { left: 48%; top: 55%; }

    .car {
      position: absolute;
      left: 43%;
      bottom: 12%;
      width: min(210px, 22vw);
      height: min(105px, 15vh);
      cursor: pointer;
      transition: transform 0.5s cubic-bezier(.34,1.56,.64,1);
    }

    .car-body {
      position: absolute;
      bottom: 25%;
      width: 100%;
      height: 55%;
      background: var(--rojo);
      border-radius: 28px 38px 20px 20px;
      border: 5px solid rgba(255,255,255,0.75);
      box-shadow: 0 10px 12px rgba(0,0,0,0.15);
    }

    .car-window {
      position: absolute;
      top: 8%;
      left: 31%;
      width: 38%;
      height: 38%;
      background: #bff4ff;
      border: 5px solid white;
      border-radius: 26px 26px 8px 8px;
    }

    .wheel {
      position: absolute;
      bottom: 4%;
      width: 34px;
      height: 34px;
      background: #26364d;
      border: 7px solid #8795a8;
      border-radius: 50%;
    }

    .wheel.left { left: 14%; }
    .wheel.right { right: 14%; }

    .animal {
      position: absolute;
      left: 27%;
      bottom: 15%;
      width: min(130px, 14vw);
      height: min(115px, 15vh);
      cursor: pointer;
      transform-origin: bottom center;
    }

    .animal-body {
      position: absolute;
      bottom: 5%;
      left: 14%;
      width: 72%;
      height: 58%;
      background: #ffb86b;
      border-radius: 42% 42% 35% 35%;
      box-shadow: inset -10px -8px 0 rgba(0,0,0,0.08);
    }

    .animal-head {
      position: absolute;
      left: 31%;
      top: 5%;
      width: 44%;
      height: 46%;
      background: #ffb86b;
      border-radius: 50%;
    }

    .ear {
      position: absolute;
      top: -5%;
      width: 26%;
      height: 34%;
      background: #e8924f;
      border-radius: 50%;
    }

    .ear.left { left: 23%; }
    .ear.right { right: 23%; }

    .eye {
      position: absolute;
      top: 37%;
      width: 7px;
      height: 7px;
      background: #26364d;
      border-radius: 50%;
    }

    .eye.left { left: 37%; }
    .eye.right { right: 37%; }

    .nose {
      position: absolute;
      left: 45%;
      top: 52%;
      width: 13%;
      height: 10%;
      background: #26364d;
      border-radius: 50%;
    }

    .flower-bed {
      position: absolute;
      left: 9%;
      bottom: 5%;
      right: 9%;
      height: 70px;
      pointer-events: none;
    }

    .flower {
      position: absolute;
      bottom: 0;
      width: 42px;
      height: 62px;
      pointer-events: auto;
      cursor: pointer;
      transform-origin: bottom center;
    }

    .stem {
      position: absolute;
      bottom: 0;
      left: 48%;
      width: 5px;
      height: 42px;
      background: #219653;
      border-radius: 5px;
    }

    .petal {
      position: absolute;
      width: 20px;
      height: 20px;
      background: var(--rosa);
      border-radius: 50%;
      top: 0;
      left: 11px;
    }

    .petal.p1 { transform: translateY(-4px); }
    .petal.p2 { transform: translateX(-11px) translateY(7px); }
    .petal.p3 { transform: translateX(11px) translateY(7px); }
    .petal.p4 { transform: translateY(17px); }
    .center {
      position: absolute;
      width: 15px;
      height: 15px;
      background: var(--amarillo);
      border-radius: 50%;
      top: 14px;
      left: 13px;
    }

    .flower.f1 { left: 8%; }
    .flower.f2 { left: 22%; transform: scale(0.86); }
    .flower.f3 { left: 58%; transform: scale(1.05); }
    .flower.f4 { left: 75%; transform: scale(0.9); }

    .play-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
      padding: 105px 24px 24px;
      background: rgba(255,255,255,0.16);
    }

    .play-layer.active {
      display: block;
    }

    .activity-card {
      height: 100%;
      border-radius: 28px;
      background: rgba(255,255,255,0.72);
      border: 5px solid white;
      box-shadow: 0 12px 28px rgba(24, 55, 90, 0.18);
      padding: 18px;
      overflow: hidden;
    }

    .activity-title {
      margin: 0 0 12px;
      font-size: clamp(22px, 3vw, 36px);
      text-align: center;
    }

    .blocks-zone {
      height: calc(100% - 58px);
      display: grid;
      grid-template-columns: 1fr 230px;
      gap: 16px;
    }

    .build-area {
      position: relative;
      border-radius: 24px;
      background: linear-gradient(#dff9ff, #f8fff0);
      border: 4px dashed rgba(35,100,170,0.35);
      overflow: hidden;
    }

    .ground-line {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 50px;
      height: 10px;
      background: rgba(47, 158, 68, 0.4);
      border-radius: 999px;
    }

    .palette {
      border-radius: 24px;
      background: rgba(255,255,255,0.78);
      border: 4px solid white;
      padding: 12px;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .block-btn,
    .big-action {
      border: 0;
      border-radius: 20px;
      min-height: 58px;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 7px 0 rgba(0,0,0,0.18);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .block-btn:active,
    .big-action:active,
    .menu-button:active {
      transform: translateY(4px) scale(0.98);
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }

    .placed-block {
      position: absolute;
      width: 92px;
      height: 58px;
      border-radius: 15px;
      border: 4px solid rgba(255,255,255,0.72);
      box-shadow: 0 8px 0 rgba(0,0,0,0.14);
      cursor: grab;
      touch-action: none;
    }

    .placed-block::before,
    .placed-block::after {
      content: "";
      position: absolute;
      top: 9px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
    }

    .placed-block::before { left: 22px; }
    .placed-block::after { right: 22px; }

    .color-zone,
    .count-zone {
      height: calc(100% - 58px);
      display: grid;
      grid-template-columns: 1fr 245px;
      gap: 16px;
    }

    .paint-board,
    .count-board {
      position: relative;
      border-radius: 24px;
      background: linear-gradient(#effcff, #ffffff);
      border: 4px dashed rgba(35,100,170,0.3);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 20px;
    }

    .paint-shape {
      width: min(170px, 20vw);
      height: min(170px, 20vw);
      border-radius: 35px;
      background: #ffd95a;
      border: 6px solid rgba(255,255,255,0.95);
      box-shadow: 0 12px 0 rgba(0,0,0,0.13);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: clamp(40px, 7vw, 76px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .paint-shape.circle { border-radius: 50%; }
    .paint-shape.triangle {
      width: 0;
      height: 0;
      border-left: 92px solid transparent;
      border-right: 92px solid transparent;
      border-bottom: 166px solid #ffd95a;
      background: transparent !important;
      box-shadow: none;
      border-radius: 0;
      position: relative;
    }

    .paint-shape.triangle span {
      position: absolute;
      left: -31px;
      top: 68px;
    }

    .color-btn {
      border: 5px solid white;
      border-radius: 20px;
      min-height: 62px;
      cursor: pointer;
      box-shadow: 0 7px 0 rgba(0,0,0,0.16);
    }

    .color-btn.selected {
      outline: 6px solid #26364d;
    }

    .count-item {
      width: min(110px, 12vw);
      height: min(110px, 12vw);
      border-radius: 32px;
      background: #ffb86b;
      border: 5px solid white;
      box-shadow: 0 8px 0 rgba(0,0,0,0.14);
      display: grid;
      place-items: center;
      font-size: clamp(34px, 5vw, 60px);
      animation: popIn 0.35s ease both;
    }

    .number-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-content: center;
    }

    .num-btn {
      min-height: 86px;
      border: 5px solid white;
      border-radius: 24px;
      background: #ffd95a;
      color: var(--texto);
      font-size: 42px;
      font-weight: 900;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor: pointer;
    }

    .side-menu {
      height: 100%;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.85);
      border: 6px solid rgba(255,255,255,0.75);
      box-shadow: var(--sombra);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .menu-header {
      background: linear-gradient(135deg, #fff1a8, #ffd95a);
      border-radius: 24px;
      padding: 12px;
      text-align: center;
      border: 4px solid white;
    }

    .menu-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .menu-header p {
      margin: 3px 0 0;
      font-weight: 800;
      color: #5d6d7e;
      font-size: 13px;
    }

    .menu-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .menu-button {
      border: 0;
      min-height: 83px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 7px 0 rgba(0,0,0,0.16);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 900;
      color: var(--texto);
      font-size: 13px;
      border: 4px solid rgba(255,255,255,0.9);
      transition: transform 0.1s ease, box-shadow 0.1s ease, outline 0.1s ease;
    }

    .menu-button .icon {
      font-size: 33px;
      line-height: 1;
    }

    .menu-button.active {
      outline: 5px solid var(--azul-oscuro);
      background: #e9f8ff;
    }

    .message-box {
      flex: 1;
      min-height: 110px;
      border-radius: 24px;
      background: #f2fbff;
      border: 4px solid white;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 19px;
      font-weight: 900;
      line-height: 1.25;
      color: #31536e;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .small-btn {
      border: 0;
      border-radius: 19px;
      background: #26364d;
      color: white;
      min-height: 52px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
    }

    .celebration {
      position: absolute;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      overflow: hidden;
    }

    .star-pop {
      position: absolute;
      font-size: 42px;
      animation: starFly 1s ease-out forwards;
    }

    .toast {
      position: absolute;
      z-index: 80;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.92);
      border: 5px solid white;
      border-radius: 24px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      padding: 12px 22px;
      font-size: clamp(20px, 2.5vw, 34px);
      font-weight: 900;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-8px);
    }

    .hidden {
      display: none !important;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(8deg); }
    }

    @keyframes drift {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(35px); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-24px) scale(1.05); }
      70% { transform: translateY(0) scale(0.96); }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }

    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes starFly {
      0% { transform: translateY(0) scale(0.4) rotate(0); opacity: 1; }
      100% { transform: translateY(-150px) scale(1.3) rotate(180deg); opacity: 0; }
    }

    .bounce { animation: bounce 0.5s ease; }
    .wiggle { animation: wiggle 0.45s ease; }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr 210px;
        gap: 10px;
        padding: 10px;
      }

      .side-menu {
        padding: 9px;
      }

      .menu-header h2 { font-size: 19px; }
      .menu-header p { font-size: 12px; }
      .menu-button { min-height: 70px; font-size: 12px; }
      .menu-button .icon { font-size: 27px; }
      .message-box { font-size: 16px; padding: 8px; }
      .blocks-zone,
      .color-zone,
      .count-zone {
        grid-template-columns: 1fr 170px;
      }
    }

    @media (orientation: portrait) {
      body { overflow: auto; }
      .app {
        min-height: 100vh;
        height: auto;
        grid-template-columns: 1fr;
      }
      .game-area {
        height: 68vh;
        min-height: 520px;
      }
      .side-menu {
        height: auto;
      }
      .menu-buttons {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="game-area" id="gameArea" aria-label="Zona de juego">
      <div class="top-bar">
        <div class="title-card">
          <h1>🌈 Aventura de Cubitos</h1>
          <p>Toca, juega, pinta y construye</p>
        </div>
        <div class="score-card" aria-label="Estrellas conseguidas">
          ⭐ <span id="score">0</span>
        </div>
      </div>

      <div class="world" id="worldLayer">
        <div class="sun" data-say="¡Sol brillante!" aria-label="Sol"></div>
        <div class="cloud one" data-say="¡Nube blandita!" aria-label="Nube"></div>
        <div class="cloud two" data-say="¡Otra nube!" aria-label="Nube"></div>

        <div class="house" id="house" aria-label="Casa">
          <div class="house-roof"></div>
          <div class="house-body">
            <div class="window left"></div>
            <div class="window right"></div>
            <div class="door" id="door"></div>
          </div>
        </div>

        <div class="animal" id="animal" aria-label="Perrito">
          <div class="animal-body"></div>
          <div class="animal-head">
            <div class="ear left"></div>
            <div class="ear right"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="nose"></div>
          </div>
        </div>

        <div class="car" id="car" aria-label="Coche">
          <div class="car-window"></div>
          <div class="car-body"></div>
          <div class="wheel left"></div>
          <div class="wheel right"></div>
        </div>

        <div class="tree" id="tree" aria-label="Árbol">
          <div class="tree-trunk"></div>
          <div class="tree-top">
            <div class="apple a1"></div>
            <div class="apple a2"></div>
            <div class="apple a3"></div>
          </div>
        </div>

        <div class="flower-bed">
          <div class="flower f1" data-say="¡Flor rosa!"><div class="stem"></div><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="center"></div></div>
          <div class="flower f2" data-say="¡Qué bonita!"><div class="stem"></div><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="center"></div></div>
          <div class="flower f3" data-say="¡Huele bien!"><div class="stem"></div><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="center"></div></div>
          <div class="flower f4" data-say="¡Otra flor!"><div class="stem"></div><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="center"></div></div>
        </div>
      </div>

      <div class="play-layer" id="blocksLayer">
        <div class="activity-card">
          <h2 class="activity-title">🧱 Construye con cubitos</h2>
          <div class="blocks-zone">
            <div class="build-area" id="buildArea">
              <div class="ground-line"></div>
            </div>
            <div class="palette">
              <button class="block-btn" style="background:#ff6b6b" data-color="#ff6b6b">Rojo</button>
              <button class="block-btn" style="background:#ffd95a" data-color="#ffd95a">Amarillo</button>
              <button class="block-btn" style="background:#62d45f" data-color="#62d45f">Verde</button>
              <button class="block-btn" style="background:#5ec8ff" data-color="#5ec8ff">Azul</button>
              <button class="big-action" id="towerBtn" style="background:#8e7dff;color:white">🏰 Torre</button>
              <button class="big-action" id="clearBlocksBtn" style="background:#26364d;color:white">🧹 Limpiar</button>
            </div>
          </div>
        </div>
      </div>

      <div class="play-layer" id="colorsLayer">
        <div class="activity-card">
          <h2 class="activity-title">🎨 Pinta las formas</h2>
          <div class="color-zone">
            <div class="paint-board">
              <div class="paint-shape circle" data-shape="circle"><span>😊</span></div>
              <div class="paint-shape square" data-shape="square"><span>⭐</span></div>
              <div class="paint-shape triangle" data-shape="triangle"><span>🚗</span></div>
            </div>
            <div class="palette">
              <button class="color-btn selected" style="background:#ff6b6b" data-paint="#ff6b6b"></button>
              <button class="color-btn" style="background:#ffd95a" data-paint="#ffd95a"></button>
              <button class="color-btn" style="background:#62d45f" data-paint="#62d45f"></button>
              <button class="color-btn" style="background:#5ec8ff" data-paint="#5ec8ff"></button>
              <button class="color-btn" style="background:#8e7dff" data-paint="#8e7dff"></button>
              <button class="color-btn" style="background:#ff8bd1" data-paint="#ff8bd1"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="play-layer" id="countLayer">
        <div class="activity-card">
          <h2 class="activity-title" id="countTitle">🔢 ¿Cuántos hay?</h2>
          <div class="count-zone">
            <div class="count-board" id="countBoard"></div>
            <div class="number-choices" id="numberChoices"></div>
          </div>
        </div>
      </div>

      <div class="toast" id="toast">¡Muy bien!</div>
      <div class="celebration" id="celebration"></div>
    </section>

    <aside class="side-menu" aria-label="Menú de juegos">
      <div class="menu-header">
        <h2>Menú</h2>
        <p>Todo a mano para tablet</p>
      </div>

      <div class="menu-buttons">
        <button class="menu-button active" data-mode="world">
          <span class="icon">🏡</span>
          Mundo
        </button>
        <button class="menu-button" data-mode="blocks">
          <span class="icon">🧱</span>
          Cubitos
        </button>
        <button class="menu-button" data-mode="colors">
          <span class="icon">🎨</span>
          Colores
        </button>
        <button class="menu-button" data-mode="count">
          <span class="icon">🔢</span>
          Contar
        </button>
        <button class="menu-button" id="partyBtn">
          <span class="icon">🎉</span>
          Fiesta
        </button>
        <button class="menu-button" id="soundBtn">
          <span class="icon">🔊</span>
          Sonido
        </button>
      </div>

      <div class="message-box" id="messageBox">
        Toca la casa, el coche, el perrito, el árbol o las flores.
      </div>

      <div class="controls-row">
        <button class="small-btn" id="resetBtn">Reiniciar</button>
        <button class="small-btn" id="fullscreenBtn">Pantalla</button>
      </div>
    </aside>
  </main>

  <script>
    const scoreEl = document.getElementById('score');
    const messageBox = document.getElementById('messageBox');
    const toast = document.getElementById('toast');
    const celebration = document.getElementById('celebration');
    const worldLayer = document.getElementById('worldLayer');
    const blocksLayer = document.getElementById('blocksLayer');
    const colorsLayer = document.getElementById('colorsLayer');
    const countLayer = document.getElementById('countLayer');
    const buildArea = document.getElementById('buildArea');
    const countBoard = document.getElementById('countBoard');
    const numberChoices = document.getElementById('numberChoices');

    let score = 0;
    let soundEnabled = true;
    let currentPaint = '#ff6b6b';
    let blockIndex = 0;
    let correctCount = 3;

    const messages = [
      '¡Muy bien!',
      '¡Genial!',
      '¡Otra vez!',
      '¡Qué divertido!',
      '¡Bravo!',
      '¡Lo has hecho genial!'
    ];

    function setMessage(text) {
      messageBox.textContent = text;
    }

    function addScore(points = 1) {
      score += points;
      scoreEl.textContent = score;
    }

    function randomMessage() {
      return messages[Math.floor(Math.random() * messages.length)];
    }

    function showToast(text = randomMessage()) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1100);
    }

    function beep(freq = 440, duration = 0.12, type = 'sine') {
      if (!soundEnabled) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.03);
    }

    function happySound() {
      beep(523, 0.09);
      setTimeout(() => beep(659, 0.09), 95);
      setTimeout(() => beep(784, 0.12), 190);
    }

    function animateOnce(el, className) {
      el.classList.remove(className);
      void el.offsetWidth;
      el.classList.add(className);
      setTimeout(() => el.classList.remove(className), 600);
    }

    function starBurst(amount = 9) {
      const rect = celebration.getBoundingClientRect();
      for (let i = 0; i < amount; i++) {
        const star = document.createElement('div');
        star.className = 'star-pop';
        star.textContent = ['⭐','🌟','✨','💫'][Math.floor(Math.random() * 4)];
        star.style.left = Math.random() * rect.width + 'px';
        star.style.top = (rect.height * 0.55 + Math.random() * rect.height * 0.35) + 'px';
        star.style.animationDelay = Math.random() * 0.18 + 's';
        celebration.appendChild(star);
        setTimeout(() => star.remove(), 1200);
      }
    }

    function reward(text = randomMessage()) {
      addScore(1);
      showToast(text);
      happySound();
      starBurst(5);
    }

    function setMode(mode) {
      document.querySelectorAll('.menu-button[data-mode]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      worldLayer.classList.toggle('hidden', mode !== 'world');
      blocksLayer.classList.toggle('active', mode === 'blocks');
      colorsLayer.classList.toggle('active', mode === 'colors');
      countLayer.classList.toggle('active', mode === 'count');

      if (mode === 'world') setMessage('Toca la casa, el coche, el perrito, el árbol o las flores.');
      if (mode === 'blocks') setMessage('Elige cubitos y muévelos con el dedo.');
      if (mode === 'colors') setMessage('Elige un color y toca una forma para pintarla.');
      if (mode === 'count') {
        setMessage('Cuenta los juguetes y toca el número correcto.');
        newCountRound();
      }
    }

    document.querySelectorAll('.menu-button[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    document.getElementById('house').addEventListener('click', () => {
      const door = document.getElementById('door');
      door.classList.toggle('open');
      setMessage(door.classList.contains('open') ? '¡La puerta está abierta!' : '¡La puerta está cerrada!');
      reward('¡Hola casa!');
    });

    document.getElementById('animal').addEventListener('click', (e) => {
      animateOnce(e.currentTarget, 'bounce');
      setMessage('¡Guau guau! El perrito salta.');
      beep(330, 0.08, 'square');
      setTimeout(() => beep(260, 0.08, 'square'), 110);
      addScore(1);
      showToast('¡Guau!');
      starBurst(4);
    });

    document.getElementById('car').addEventListener('click', (e) => {
      const car = e.currentTarget;
      car.style.transform = car.style.transform ? '' : 'translateX(80px)';
      setMessage('¡Brrrum! El coche se mueve.');
      beep(180, 0.14, 'sawtooth');
      reward('¡Brrrum!');
    });

    document.getElementById('tree').addEventListener('click', (e) => {
      animateOnce(e.currentTarget, 'wiggle');
      setMessage('¡Han caído manzanas mágicas!');
      reward('¡Árbol mágico!');
    });

    document.querySelectorAll('[data-say]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        animateOnce(el, 'bounce');
        setMessage(el.dataset.say);
        reward(el.dataset.say);
      });
    });

    function createBlock(color, x, y) {
      const block = document.createElement('div');
      block.className = 'placed-block';
      block.style.background = color;
      block.style.left = x + 'px';
      block.style.top = y + 'px';
      block.style.zIndex = 50 + blockIndex++;
      buildArea.appendChild(block);
      makeDraggable(block);
      reward('¡Cubito!');
    }

    document.querySelectorAll('.block-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const rect = buildArea.getBoundingClientRect();
        createBlock(btn.dataset.color, rect.width / 2 - 46 + Math.random() * 40 - 20, rect.height - 125 - Math.random() * 130);
        setMessage('Puedes mover el cubito con el dedo.');
      });
    });

    document.getElementById('towerBtn').addEventListener('click', () => {
      buildArea.querySelectorAll('.placed-block').forEach(b => b.remove());
      const colors = ['#ff6b6b', '#ffd95a', '#62d45f', '#5ec8ff', '#8e7dff'];
      const rect = buildArea.getBoundingClientRect();
      colors.forEach((color, i) => {
        createBlock(color, rect.width / 2 - 46, rect.height - 115 - i * 60);
      });
      setMessage('¡Has construido una torre!');
      starBurst(12);
    });

    document.getElementById('clearBlocksBtn').addEventListener('click', () => {
      buildArea.querySelectorAll('.placed-block').forEach(b => b.remove());
      setMessage('Zona limpia para construir otra vez.');
      beep(300, 0.12);
    });

    function makeDraggable(el) {
      let dragging = false;
      let offsetX = 0;
      let offsetY = 0;

      el.addEventListener('pointerdown', (e) => {
        dragging = true;
        el.setPointerCapture(e.pointerId);
        const r = el.getBoundingClientRect();
        offsetX = e.clientX - r.left;
        offsetY = e.clientY - r.top;
        el.style.zIndex = 100 + blockIndex++;
        el.style.cursor = 'grabbing';
      });

      el.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const area = buildArea.getBoundingClientRect();
        let x = e.clientX - area.left - offsetX;
        let y = e.clientY - area.top - offsetY;
        x = Math.max(0, Math.min(area.width - el.offsetWidth, x));
        y = Math.max(0, Math.min(area.height - el.offsetHeight, y));
        el.style.left = x + 'px';
        el.style.top = y + 'px';
      });

      el.addEventListener('pointerup', () => {
        dragging = false;
        el.style.cursor = 'grab';
        beep(420, 0.06);
      });
    }

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        currentPaint = btn.dataset.paint;
        setMessage('Color elegido. Ahora toca una forma.');
        beep(500, 0.08);
      });
    });

    document.querySelectorAll('.paint-shape').forEach(shape => {
      shape.addEventListener('click', () => {
        if (shape.classList.contains('triangle')) {
          shape.style.borderBottomColor = currentPaint;
        } else {
          shape.style.background = currentPaint;
        }
        animateOnce(shape, 'bounce');
        reward('¡Color bonito!');
        setMessage('¡Has pintado una forma!');
      });
    });

    function newCountRound() {
      countBoard.innerHTML = '';
      numberChoices.innerHTML = '';
      correctCount = Math.floor(Math.random() * 5) + 1;
      const emojis = ['🚗', '⭐', '🍎', '🧸', '⚽', '🐶'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];

      for (let i = 0; i < correctCount; i++) {
        const item = document.createElement('div');
        item.className = 'count-item';
        item.textContent = emoji;
        item.style.animationDelay = (i * 0.08) + 's';
        countBoard.appendChild(item);
      }

      const choices = new Set([correctCount]);
      while (choices.size < 4) {
        choices.add(Math.floor(Math.random() * 5) + 1);
      }

      [...choices].sort(() => Math.random() - 0.5).forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.textContent = num;
        btn.addEventListener('click', () => {
          if (num === correctCount) {
            setMessage('¡Correcto! Has contado muy bien.');
            reward('¡Correcto!');
            setTimeout(newCountRound, 900);
          } else {
            setMessage('Casi, casi. Prueba otra vez.');
            showToast('Prueba otra vez');
            beep(210, 0.12, 'triangle');
          }
        });
        numberChoices.appendChild(btn);
      });
    }

    document.getElementById('partyBtn').addEventListener('click', () => {
      setMessage('¡Fiesta de estrellas!');
      showToast('¡Fiesta!');
      happySound();
      starBurst(28);
      addScore(3);
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.querySelector('#soundBtn .icon').textContent = soundEnabled ? '🔊' : '🔇';
      setMessage(soundEnabled ? 'Sonido activado.' : 'Sonido desactivado.');
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      score = 0;
      scoreEl.textContent = score;
      buildArea.querySelectorAll('.placed-block').forEach(b => b.remove());
      document.getElementById('door').classList.remove('open');
      document.getElementById('car').style.transform = '';
      setMode('world');
      setMessage('Juego reiniciado. ¡A jugar otra vez!');
      showToast('Reiniciado');
    });

    document.getElementById('fullscreenBtn').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {
        setMessage('Pantalla completa no disponible aquí.');
      }
    });
  </script>
</body>
</html>
