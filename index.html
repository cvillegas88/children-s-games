<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos de Mateo 🎮</title>
<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(#7dd3fc,#86efac);
  text-align:center;
}

h1 {
  font-size:40px;
  margin-top:20px;
}

.menu {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  padding:20px;
  max-width:600px;
  margin:auto;
}

.game-btn {
  background:white;
  border-radius:20px;
  padding:20px;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 6px 0 #333;
  cursor:pointer;
}

.game-btn:active {
  transform:translateY(4px);
  box-shadow:0 2px 0 #333;
}

#gameContainer {
  display:none;
  padding:10px;
}

.back {
  margin:10px;
  font-size:18px;
}

/* Juego memoria */
.grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  max-width:400px;
  margin:auto;
}

.card {
  background:#fde68a;
  height:80px;
  font-size:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  cursor:pointer;
}

.hidden {
  background:#444;
}

</style>
</head>
<body>

<h1>🎮 Juegos de Mateo</h1>
<p>Elige un juego</p>

<div id="menu" class="menu">
  <div class="game-btn" onclick="startGame('memoria')">🐾 Memoria de animales</div>
  <div class="game-btn" onclick="startGame('cubitos')">⛏️ Aventura de cubitos</div>
</div>

<div id="gameContainer">
  <button class="back" onclick="goBack()">⬅️ Volver</button>
  <div id="game"></div>
</div>

<script>
function startGame(game){
  document.getElementById('menu').style.display='none';
  document.getElementById('gameContainer').style.display='block';

  if(game==='memoria') loadMemoryGame();
  if(game==='cubitos') loadCubitos();
}

function goBack(){
  document.getElementById('menu').style.display='grid';
  document.getElementById('gameContainer').style.display='none';
  document.getElementById('game').innerHTML='';
}

/* =====================
   JUEGO MEMORIA
===================== */
function loadMemoryGame(){
  const emojis=['🐶','🐱','🐸','🐷','🐮','🐔'];
  let cards=[...emojis,...emojis].sort(()=>Math.random()-0.5);

  let first=null;
  let lock=false;

  let html='<h2>Encuentra las parejas</h2><div class="grid">';

  cards.forEach((emoji,i)=>{
    html+=`<div class="card hidden" data-i="${i}" onclick="flip(${i})">${emoji}</div>`;
  });

  html+='</div>';

  document.getElementById('game').innerHTML=html;

  window.flip=(i)=>{
    if(lock) return;
    const cardsEl=document.querySelectorAll('.card');
    const el=cardsEl[i];

    if(!el.classList.contains('hidden')) return;

    el.classList.remove('hidden');

    if(!first){
      first=i;
    }else{
      lock=true;
      if(cards[i]===cards[first]){
        first=null;
        lock=false;
      }else{
        setTimeout(()=>{
          cardsEl[i].classList.add('hidden');
          cardsEl[first].classList.add('hidden');
          first=null;
          lock=false;
        },800);
      }
    }
  }
}

/* =====================
   MINI CUBITOS SIMPLE
===================== */
function loadCubitos(){
  let world=Array(16).fill(null);

  let html='<h2>Construye con bloques</h2>';
  html+='<p>Toca para poner bloques</p>';
  html+='<div class="grid">';

  world.forEach((_,i)=>{
    html+=`<div class="card" onclick="place(${i})">⬜</div>`;
  });

  html+='</div>';

  document.getElementById('game').innerHTML=html;

  window.place=(i)=>{
    const cells=document.querySelectorAll('.card');
    cells[i].textContent='🟩';
  }
}
</script>

</body>
</html>
